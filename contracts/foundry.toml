[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "test/fixtures" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[lint]
exclude_lints = ["block-timestamp"]

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
